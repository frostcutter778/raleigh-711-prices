name: Update fuel prices

on:
  schedule:
    # GitHub often skips a 5-minute schedule. This only restarts the chain if a run dies.
    # Each run starts the next check itself, about 5 minutes later.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fuel-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out price history
        uses: actions/checkout@v4
        with:
          ref: data
          path: price-data

      - name: Check out updater
        uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Raleigh 7-Eleven prices
        working-directory: source
        env:
          DATA_FILE: ${{ github.workspace }}/price-data/prices.json
        run: node scripts/update-prices.mjs

      - name: Publish price data
        working-directory: price-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No new price snapshot."
          else
            git commit -m "Update Raleigh fuel prices"
            git push
          fi

      - name: Start the next check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 260
          others=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=30" --jq '[.workflow_runs[] | select(.name == "Update fuel prices" and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") and .id != ${{ github.run_id }})] | length')
          if [ "$others" != "0" ]; then
            echo "Another check is already lined up ($others)."
            exit 0
          fi
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/update-prices.yml/dispatches" -f ref="${{ github.ref_name }}"
          echo "Started the next check."
